{% for batch in batches %}
<h3>{{ batch }}</h3>
{% for message in batches[batch] %}
<div class="rea-email-panel" style="margin-bottom: 12px;">
	{{ frappe.utils.md_to_html(message.message) }}
	<p><strong>{{ _("Posted by:") }}</strong> {{ message.author }}<br>
	{{ frappe.utils.format_datetime(message.creation, "medium") }}</p>
</div>
{% endfor %}
{% endfor %}
