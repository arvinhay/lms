<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
	<meta name="viewport" content="width=device-width" />
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>{{ subject or "REA LMS" }}</title>
</head>
<body>
	<table class="body-table with-container rea-email" cellpadding="0" cellspacing="0" role="presentation">
		<tr>
			<td class="body-content" align="center" valign="top">
				<table class="email-container" border="0" cellpadding="0" cellspacing="0" width="620" role="presentation">
					<tr>
						<td class="rea-email-accent">&nbsp;</td>
					</tr>
					<tr>
						<td class="rea-email-brand">
							<table class="rea-email-brand-table" border="0" cellpadding="0" cellspacing="0" role="presentation">
								<tr>
									<td width="62" valign="middle">
										<a href="{{ site_url }}" aria-label="{{ _('Open REA LMS') }}">
											<img
												src="{{ brand_logo or site_url ~ '/assets/lms/frontend/rea-logo.png' }}"
												alt="{{ _('Refugee Education Australia') }}"
												class="rea-email-brand-logo"
												width="48"
												height="48"
											/>
										</a>
									</td>
									<td valign="middle">
										<div class="rea-email-brand-name">{{ _("Refugee Education Australia") }}</div>
										<div class="rea-email-brand-product">{{ _("Learning Management System") }}</div>
									</td>
								</tr>
							</table>
						</td>
					</tr>
					<tr>
						<td class="rea-email-main" valign="top">
							{{ header or "" }}
							<table class="email-body" border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation">
								<tr>
									<td valign="top">{{ content }}</td>
								</tr>
							</table>
						</td>
					</tr>
					<tr>
						<td valign="top">
							<table class="email-footer" border="0" cellpadding="0" cellspacing="0" width="100%" role="presentation">
								<tr>
									<td valign="top" data-email-footer="true">{{ footer }}</td>
								</tr>
								<tr>
									<td valign="top">
										<div class="print-html">{{ print_html or "" }}</div>
									</td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
